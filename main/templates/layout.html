<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alumni+Sans:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'main/style.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>{% block title %} {% endblock %}</title>
</head>

<body>

    <header class="header">
        <button class="button-menu" onclick="toggleMenu()">
            <i class="bi bi-justify"></i>
        </button>
        <h3>best</h3>
    </header>

    <!-- Выезжающая панель меню -->
    <div class="sidebar" id="sidebar">
        {% for category in categories %}
            <a href="{% url 'category' category.slug %}">{{ category.name }}</a>
        {% endfor %}
    </div>

    {% block body %}
    {% endblock %}

    <script>
    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    // Закрытие при клике вне панели
    document.addEventListener('click', function(event) {
        const sidebar = document.getElementById('sidebar');
        const button = document.querySelector('.button-menu');

        // Если клик НЕ по панели и НЕ по кнопке — закрываем
        if (!sidebar.contains(event.target) && !button.contains(event.target)) {
            sidebar.classList.remove('open');
        }
    });
</script>

</body>
</html>
